name: Auto Patch & Build

on:
  schedule:
    - cron: "0 3 * * *"   # tiap hari 03:00 UTC
  workflow_dispatch:       # tombol "Run workflow" manual

permissions:
  contents: write

env:
  UPSTREAM: xr3ed/M3U-Playlist-Player-Repo-for-Cloudstream

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Ambil kode terbaru dari upstream (selalu fresh, tanpa konflik merge)
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: main
          fetch-depth: 0

      # 1b. Overlay perubahan dari repo ini
      - name: Overlay perubahan dari repo ini
        uses: actions/checkout@v4
        with:
          path: _fork

      - name: Terapkan overlay
        run: |
          for d in MyHomepage xr3edFlix AnimeSailXR; do
            [ -d "_fork/$d" ] && cp -r "_fork/$d/." "$d/"
          done
          rm -rf _fork

      # 2. Hapus SecurityHelper secara otomatis
      - name: Remove SecurityHelper
        run: |
          echo "=== Pemakaian SecurityHelper/verifyApp SEBELUM dihapus ==="
          grep -rnE "SecurityHelper|verifyApp" --include=*.kt --include=*.java --include=*.kts . || true

          # hapus file helper-nya
          find . \( -name "SecurityHelper*.kt" -o -name "SecurityHelper*.java" \) -delete

          # hapus baris yang memanggilnya (import + pemanggilan)
          grep -rlE "SecurityHelper|verifyApp" --include=*.kt --include=*.java --include=*.kts . | xargs -r sed -i -E '/SecurityHelper|verifyApp/d'

          echo "=== Sisa referensi (harus kosong) ==="
          grep -rnE "SecurityHelper|verifyApp" --include=*.kt --include=*.java --include=*.kts . || echo "bersih"

      # 2b. Buang binary prebuilt upstream (tanpa source, tidak bisa dibersihkan)
      - name: Remove upstream prebuilts
        run: rm -rf prebuilts

      # 3. Arahkan URL repo di build ke fork kamu
      - name: Point repo URL to this fork
        run: |
          sed -i "s#${{ env.UPSTREAM }}#${{ github.repository }}#g" build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # 4. Build (secrets opsional)
      - name: Build Repositories & Plugins
        run: ./gradlew make makePluginsJson
        env:
          # Opsional: isi di Settings > Secrets and variables > Actions kalau punya
          CLONER_SIGNATURE: ${{ secrets.CLONER_SIGNATURE }}
          BYPASS_PASSWORD: ${{ secrets.BYPASS_PASSWORD }}
          UPDATE_JSON_URL: ${{ secrets.UPDATE_JSON_URL }}
          FALLBACK_RELEASE_URL: ${{ secrets.FALLBACK_RELEASE_URL }}
          LAYARKACA_MAIN_URL: ${{ secrets.LAYARKACA_MAIN_URL }}
          LAYARKACA_SERIES_URL: ${{ secrets.LAYARKACA_SERIES_URL }}
          LAYARKACA_SEARCH_URL: ${{ secrets.LAYARKACA_SEARCH_URL }}
          KLIKXXI_MAIN_URL: ${{ secrets.KLIKXXI_MAIN_URL }}
          BYSE_POW_LR: ${{ secrets.BYSE_POW_LR }}
          BYSE_POW_HR: ${{ secrets.BYSE_POW_HR }}
          BYSE_API_CAPTCHA: ${{ secrets.BYSE_API_CAPTCHA }}
          BYSE_API_VERIFY: ${{ secrets.BYSE_API_VERIFY }}
          BYSE_API_SETTINGS: ${{ secrets.BYSE_API_SETTINGS }}
          ABYSS_KEY_FORMAT: ${{ secrets.ABYSS_KEY_FORMAT }}
          ABYSS_PATH_FORMAT: ${{ secrets.ABYSS_PATH_FORMAT }}
          ABYSS_FINAL_FORMAT: ${{ secrets.ABYSS_FINAL_FORMAT }}
          MOVIEBOX_SECRET_KEY_DEFAULT: ${{ secrets.MOVIEBOX_SECRET_KEY_DEFAULT }}
          MOVIEBOX_SECRET_KEY_ALT: ${{ secrets.MOVIEBOX_SECRET_KEY_ALT }}
          CASTLE_SUFFIX: ${{ secrets.CASTLE_SUFFIX }}
          SIMKL_API: ${{ secrets.SIMKL_API }}
          MAL_API: ${{ secrets.MAL_API }}
          CRICIFY_PROVIDER_SECRET1: ${{ secrets.CRICIFY_PROVIDER_SECRET1 }}
          CRICIFY_PROVIDER_SECRET2: ${{ secrets.CRICIFY_PROVIDER_SECRET2 }}
          PIKASHOW_API_KEY: ${{ secrets.PIKASHOW_API_KEY }}
          PIKASHOW_HMAC_SECRET: ${{ secrets.PIKASHOW_HMAC_SECRET }}
          CRICFY_FIREBASE_API_KEY: ${{ secrets.CRICFY_FIREBASE_API_KEY }}
          CRICFY_FIREBASE_APP_ID: ${{ secrets.CRICFY_FIREBASE_APP_ID }}
          CRICFY_FIREBASE_PROJECT_NUMBER: ${{ secrets.CRICFY_FIREBASE_PROJECT_NUMBER }}
          SKLIVE_KEY: ${{ secrets.SKLIVE_KEY }}
          SKLIVE_IV: ${{ secrets.SKLIVE_IV }}
          SKLIVE_V23_KEY: ${{ secrets.SKLIVE_V23_KEY }}
          SKLIVE_V23_IV: ${{ secrets.SKLIVE_V23_IV }}
          SKTECH_FIREBASE_API_KEY: ${{ secrets.SKTECH_FIREBASE_API_KEY }}
          SKTECH_FIREBASE_APP_ID: ${{ secrets.SKTECH_FIREBASE_APP_ID }}
          SKTECH_FIREBASE_PROJECT_NUMBER: ${{ secrets.SKTECH_FIREBASE_PROJECT_NUMBER }}
          XON_FIREBASE_API_KEY: ${{ secrets.XON_FIREBASE_API_KEY }}
          XON_FIREBASE_APP_ID: ${{ secrets.XON_FIREBASE_APP_ID }}
          XON_FIREBASE_PROJECT_NUMBER: ${{ secrets.XON_FIREBASE_PROJECT_NUMBER }}
          CINETV_SECRET_KEY_ENCRYPTED: ${{ secrets.CINETV_SECRET_KEY_ENCRYPTED }}
          CINETV_DES_KEY: ${{ secrets.CINETV_DES_KEY }}
          CINETV_DES_IV: ${{ secrets.CINETV_DES_IV }}
          CINETV_AES_KEY: ${{ secrets.CINETV_AES_KEY }}
          CINETV_AES_IV: ${{ secrets.CINETV_AES_IV }}
          CINETV_WS_SECRET: ${{ secrets.CINETV_WS_SECRET }}
          SMARTLINK_URL: ${{ secrets.SMARTLINK_URL }}
          SPEEDLINK_URL: ${{ secrets.SPEEDLINK_URL }}
          XR3EV_MAIN_URL: ${{ secrets.XR3EV_MAIN_URL }}
          XR3EV_API_URL: ${{ secrets.XR3EV_API_URL }}
          XR3EV_PLAYER_URL: ${{ secrets.XR3EV_PLAYER_URL }}
          XR3EV_STREAM_URL: ${{ secrets.XR3EV_STREAM_URL }}
          RBTV_MAIN_URL: ${{ secrets.RBTV_MAIN_URL }}
          RBTV_API_HOST: ${{ secrets.RBTV_API_HOST }}
          RBTV_GIST_URL: ${{ secrets.RBTV_GIST_URL }}
          RBTV_PATH_BS: ${{ secrets.RBTV_PATH_BS }}
          RBTV_PATH_LIVE: ${{ secrets.RBTV_PATH_LIVE }}
          RBTV_PATH_DETAIL: ${{ secrets.RBTV_PATH_DETAIL }}
          RBTV_PATH_STREAM_DETAIL: ${{ secrets.RBTV_PATH_STREAM_DETAIL }}
          RBTV_USER_AGENT: ${{ secrets.RBTV_USER_AGENT }}
          RBTV_AES_KEY: ${{ secrets.RBTV_AES_KEY }}
          RBTV_AES_IV: ${{ secrets.RBTV_AES_IV }}
          XR3EV_PASSWORD: ${{ secrets.XR3EV_PASSWORD }}
          XR3EV_SALT: ${{ secrets.XR3EV_SALT }}
          XSTREAM_TMDB_API: ${{ secrets.XSTREAM_TMDB_API }}
          DRACINAIO_URL: ${{ secrets.DRACINAIO_URL }}
          DRACINAIO_V2_URL: ${{ secrets.DRACINAIO_V2_URL }}
          DRACINAIO_V2_PATH_SECTIONS: ${{ secrets.DRACINAIO_V2_PATH_SECTIONS }}
          DRACINAIO_V2_PATH_GATE_UNLOCK: ${{ secrets.DRACINAIO_V2_PATH_GATE_UNLOCK }}
          DRACINAIO_V2_PATH_CONSENT: ${{ secrets.DRACINAIO_V2_PATH_CONSENT }}
          DRACINAIO_V2_PATH_EDGE: ${{ secrets.DRACINAIO_V2_PATH_EDGE }}
          DRACINAIO_V2_PATH_REFRESH: ${{ secrets.DRACINAIO_V2_PATH_REFRESH }}
          XR3EDTV_API_BASE: ${{ secrets.XR3EDTV_API_BASE }}
          XR3EDTV_XOR_KEY: ${{ secrets.XR3EDTV_XOR_KEY }}
          XR3EDTV_SALT_KEY: ${{ secrets.XR3EDTV_SALT_KEY }}
          XR3EDTV_ONDEMAND_API: ${{ secrets.XR3EDTV_ONDEMAND_API }}
          XR3EDTV_ONDEMAND_REFERER: ${{ secrets.XR3EDTV_ONDEMAND_REFERER }}
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          WORKER_AUTH_KEY: ${{ secrets.WORKER_AUTH_KEY }}
          NASIONAL_SOURCE_URL: ${{ secrets.NASIONAL_SOURCE_URL }}
          FBOX_OAUTH_CLIENT_ID: ${{ secrets.FBOX_OAUTH_CLIENT_ID }}
          FBOX_OAUTH_CLIENT_SECRET: ${{ secrets.FBOX_OAUTH_CLIENT_SECRET }}
          MOVIEBOX_TOKEN_B64: ${{ secrets.MOVIEBOX_TOKEN_B64 }}

      # 5. Kumpulkan hasil build
      - name: Collect Build Artifacts
        env:
          REPO: ${{ github.repository }}
        run: |
          mkdir -p build-out
          # Salin HANYA .cs3 hasil kompilasi sendiri (abaikan build-out dan folder prebuilts upstream)
          find . \( -path "./build-out" -o -path "./prebuilts" \) -prune -o -name "*.cs3" -path "*build*" -exec cp {} build-out/ \;

          if [ -f "build/plugins.json" ]; then
            cp build/plugins.json build-out/plugins.json

            # Merge prebuilts upstream DIHAPUS: binary prebuilt masih mengandung SecurityHelper.
            # Hanya plugin hasil build sendiri (yang sudah dipatch) yang dipublikasikan.

            # Rekalkulasi fileHash dan fileSize dari cs3 AKTUAL di build-out
            [ -f recalculate_hashes.py ] && python3 recalculate_hashes.py

            # Cadangan list menggunakan URL jsDelivr CDN
            cp build-out/plugins.json build-out/plugins-jsdelivr.json
            sed -i "s|https://raw.githubusercontent.com/${REPO}/builds/|https://cdn.jsdelivr.net/gh/${REPO}@builds/|g" build-out/plugins-jsdelivr.json

            # Index repositori (GitHub Raw)
            echo '{"name": "M3U Playlist Player Repo (Patched)", "iconUrl": "https://cdn.jsdelivr.net/gh/'"${REPO}"'@main/live_icon.png", "description": "M3U Playlist Player extension for Cloudstream", "manifestVersion": 1, "pluginLists": ["https://raw.githubusercontent.com/'"${REPO}"'/builds/plugins.json"]}' > build-out/xr3ed.json

            # Index repositori (jsDelivr)
            echo '{"name": "M3U Playlist Player Repo (Patched, jsDelivr)", "iconUrl": "https://cdn.jsdelivr.net/gh/'"${REPO}"'@main/live_icon.png", "description": "M3U Playlist Player extension for Cloudstream (jsDelivr Backup)", "manifestVersion": 1, "pluginLists": ["https://cdn.jsdelivr.net/gh/'"${REPO}"'@builds/plugins-jsdelivr.json"]}' > build-out/xr3ed-jsdelivr.json

            echo "Artifacts collected successfully!"
            ls -la build-out
          else
            echo "Error: plugins.json not found in build/ directory!" && exit 1
          fi

      # 5b. Gerbang akhir: build GAGAL (tidak dipublish) jika SecurityHelper masih ada di .cs3
      - name: Verify no SecurityHelper in cs3
        run: |
          found=0
          for f in build-out/*.cs3; do
            n=$(unzip -p "$f" 'classes*.dex' 2>/dev/null | grep -a -c "SecurityHelper" || true)
            if [ "$n" -gt 0 ]; then
              echo "MASIH ADA  : $(basename "$f")"
              found=1
            else
              echo "bersih     : $(basename "$f")"
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "Build dibatalkan: SecurityHelper masih ditemukan."
            exit 1
          fi

      # 6. Publish ke branch "builds" di fork kamu + tag + bersihkan tag lama
      - name: Deploy to builds Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Pakai tag unik per build agar jsDelivr selalu mengambil biner segar tanpa cache
          sed -i "s|@builds|@build-${{ github.run_number }}|g" build-out/plugins-jsdelivr.json
          sed -i "s|@builds|@build-${{ github.run_number }}|g" build-out/xr3ed-jsdelivr.json

          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          cd build-out
          git init -q
          git checkout -q -b builds
          git add -A
          git commit -q -m "Auto build 🚀 (build-${{ github.run_number }}) $(date -u +'%Y-%m-%d %H:%M')"

          git push "$REMOTE" builds:builds --force

          git tag "build-${{ github.run_number }}" --force
          git push "$REMOTE" "build-${{ github.run_number }}" --force

          # Bersihkan tag lama (sisakan 5 terbaru)
          git remote add origin "$REMOTE"
          git fetch --tags
          OLD_TAGS=$(git tag -l "build-*" --sort=creatordate | head -n -5)
          for tag in $OLD_TAGS; do
            echo "Deleting old tag: $tag"
            git tag -d "$tag" || true
            git push origin ":refs/tags/$tag" || true
          done

      # 7. Purge cache jsDelivr
      - name: Purge jsDelivr Cache
        run: |
          REPO="${{ github.repository }}"
          echo "Purging ALL files from jsDelivr cache..."

          for file in build-out/*.cs3; do
            plugin=$(basename "$file" .cs3)
            echo "Purging $plugin.cs3..."
            curl -s "https://purge.jsdelivr.net/gh/${REPO}@builds/$plugin.cs3"
            echo ""
          done

          for file in plugins.json plugins-jsdelivr.json xr3ed.json xr3ed-jsdelivr.json; do
            echo "Purging $file..."
            curl -s "https://purge.jsdelivr.net/gh/${REPO}@builds/$file"
            echo ""
          done

          echo "All purges completed!"
          
